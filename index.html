<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mimo Arcade</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6f3ff;--panel:#fffdf8;--ink:#4a3b6b;--pink:#ff9ec4;--hot:#ff6fa5;--shadow:#4a3b6b;--dots:#ffffff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2147;--panel:#3a2f5f;--ink:#fff4fa;--shadow:#140f26;--dots:#3a2f5f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2a2147;--panel:#3a2f5f;--ink:#fff4fa;--shadow:#140f26;--dots:#3a2f5f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:radial-gradient(var(--dots) 2px,transparent 2.5px) 0 0/30px 30px,var(--bg);color:var(--ink);font-family:"Fredoka","Trebuchet MS",sans-serif;font-size:clamp(17px,3.5vw,20px);line-height:1.4}
main{max-width:960px;margin:0 auto;padding:20px 16px 44px}
main.wrap{max-width:520px}
h1,h2{font-family:"Pixelify Sans","Fredoka",sans-serif;font-weight:600;margin:0;line-height:1.15}
h1{font-size:clamp(34px,8vw,54px);margin-bottom:8px}
h2{font-size:clamp(22px,5vw,28px)}
p{margin:0 0 12px}
:focus-visible{outline:4px dashed var(--hot);outline-offset:3px}
.btn{display:inline-block;font:600 18px "Fredoka",sans-serif;background:#fff0a6;color:#4a3b6b;border:3px solid var(--ink);border-radius:999px;box-shadow:0 4px 0 var(--shadow);padding:8px 20px;cursor:pointer;text-decoration:none}
.btn:active,.card:active{transform:translateY(3px);box-shadow:none}
.mid{display:block;margin:0 auto}
.hero{background:var(--panel);border:4px solid var(--ink);border-radius:28px;box-shadow:0 7px 0 var(--shadow);padding:22px;display:flex;flex-wrap:wrap;gap:22px;align-items:center;justify-content:center}
.htext{flex:1 1 260px}
.sub{margin:32px 0 14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.gc{display:flex;gap:14px;align-items:center;padding:12px;background:var(--panel);color:var(--ink);border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--shadow);text-decoration:none}
.gc:active{transform:translateY(4px);box-shadow:none}
.ic{flex:none;width:62px;height:62px;display:grid;place-items:center;border:3px solid var(--ink);border-radius:16px;font-size:32px}
.gt b{display:block;font-size:20px}.gt span{display:block;line-height:1.25}
.gt em{display:block;font-style:normal;color:var(--hot);font-weight:600;margin-top:3px}
.foot{margin-top:34px;text-align:center}
.mas{position:relative;display:flex;flex-direction:column;align-items:center}
.bub{position:relative;background:#fff;color:#4a3b6b;border:3px solid #4a3b6b;border-radius:16px;padding:6px 14px;font-weight:600;font-size:18px;margin-bottom:14px;max-width:250px;text-align:center}
.bub::after{content:"";position:absolute;left:50%;bottom:-10px;width:14px;height:14px;background:#fff;border-right:3px solid #4a3b6b;border-bottom:3px solid #4a3b6b;transform:translateX(-50%) rotate(45deg)}
.mochi{width:var(--w,120px);aspect-ratio:16/14;image-rendering:pixelated;cursor:pointer;animation:bob 2.2s ease-in-out infinite}
.mas.big .mochi{--w:min(210px,52vw)}.mas.sm .mochi{--w:78px}
.mas.sm{flex-direction:row;justify-content:center;gap:14px;margin-bottom:10px}
.mas.sm .bub{order:2;margin:0;max-width:300px;text-align:left}
.mas.sm .bub::after{left:-10px;bottom:auto;top:50%;transform:translateY(-50%) rotate(135deg)}
@keyframes bob{50%{transform:translateY(-6px) scale(1.03,.97)}}
.ht{position:absolute;bottom:35%;font-size:24px;pointer-events:none;animation:up 1.2s ease-out forwards}
@keyframes up{to{transform:translateY(-90px);opacity:0}}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.top h2{flex:1 1 120px}.tag{background:var(--panel);border:3px solid var(--ink);border-radius:999px;padding:0 12px;font-weight:600}
.hud{display:table;margin:10px auto;background:var(--panel);border:3px solid var(--ink);border-radius:999px;padding:2px 18px;font-weight:600;font-size:21px;min-height:1.6em;text-align:center}
.play{background:var(--panel);border:4px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--shadow);padding:12px;margin-bottom:14px}
.how{text-align:center}
.grid{display:grid;gap:8px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.card{aspect-ratio:1;border:3px solid var(--ink);border-radius:16px;background:#ffc2da;color:#4a3b6b;font:600 clamp(20px,7vw,34px) "Fredoka",sans-serif;cursor:pointer;box-shadow:0 4px 0 var(--shadow);padding:0}
.card.up{background:#fff0a6}.card.done{background:#b8f0d8}
.card.hole{background:var(--panel);color:var(--ink);box-shadow:inset 0 4px 0 rgba(0,0,0,.15)}
.card.up.mp,.boop{background-image:var(--mochi);background-repeat:no-repeat;background-position:center;background-size:82%;image-rendering:pixelated}
.pk{border-radius:50%}
.tile{aspect-ratio:1;border:3px solid var(--ink);border-radius:14px;display:grid;place-items:center;font:600 clamp(16px,6vw,28px) "Fredoka",sans-serif;color:#4a3b6b;background:var(--bg)}
.cv{display:block;width:100%;height:auto;aspect-ratio:4/3;image-rendering:pixelated;border:3px solid var(--ink);border-radius:14px;touch-action:none}
.cv.sq{aspect-ratio:1}
.pad{display:flex;justify-content:center;gap:8px;margin-top:12px}
.p2{aspect-ratio:1.3;border:3px solid var(--ink);border-radius:20px;opacity:.55;cursor:pointer;box-shadow:0 4px 0 var(--shadow);padding:0}
.p2.lit{opacity:1;filter:brightness(1.15);transform:scale(.96)}
.boop{display:block;margin:0 auto;width:min(86%,320px);aspect-ratio:16/14;border:0;background-color:transparent;cursor:pointer;padding:0}
.boop.sq{animation:sq .18s}
@keyframes sq{50%{transform:scale(1.14,.86)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body{font-family:"Pixelify Sans",monospace;font-size:clamp(16px,3vw,19px)}
h1,h2,.nav b{font-family:"Press Start 2P","Pixelify Sans",monospace;font-weight:400;line-height:1.5}
h1{font-size:clamp(18px,5vw,32px)}h2{font-size:clamp(12px,3vw,18px)}
.btn,.card,.tile,.tag,.hud,.bub{font-family:"Pixelify Sans",monospace!important;font-weight:700}
.hero,.gc,.play,.btn,.card,.tile,.hud,.tag,.ic,.bub,.sbox,.p2,.cv,.nb,.board{border:0!important;border-radius:0!important;margin:5px;box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),inset 4px 4px 0 rgba(255,255,255,.6),inset -4px -4px 0 rgba(0,0,0,.18),8px 12px 0 0 var(--shadow)!important}
.btn:active,.gc:active,.card:active,.nb:active{transform:translate(5px,7px);box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink)!important}
.bub{margin-bottom:20px}.bub::after{border-radius:0}
.grid{gap:14px}.cards{gap:26px}.gc{transition:transform .1s;background:linear-gradient(var(--panel),var(--panel))}.gc.lk{filter:grayscale(.85);opacity:.8}.shk{animation:shk .3s}
@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 14px;background:#ff9ec4;border-bottom:4px solid var(--ink);box-shadow:0 6px 0 var(--shadow);color:#4a3b6b}
.nav b{font-size:12px;margin-right:auto;display:flex;align-items:center;gap:8px}.nav canvas{width:36px;image-rendering:pixelated}
.nb{background:#fff0a6;color:#4a3b6b;font:700 15px "Pixelify Sans";padding:4px 12px;cursor:pointer;text-decoration:none}
main.wrap{max-width:1100px}.play{display:flex;justify-content:center;padding:14px}
.play>div{margin:auto;width:min(100%,max(300px,calc(100dvh - 330px)))}
.play>div:has(.cv:not(.sq):not(.wide)){width:min(100%,calc((100dvh - 330px)*1.33))}
.play>div:has(.wide){width:min(100%,max(340px,calc((100dvh - 400px)*1.78)),980px)}
.cv.wide{aspect-ratio:16/9;width:calc(100% - 10px)}.sbox{padding:14px;margin:18px 5px 8px;background:var(--panel)}
.stx{min-height:4.4em;margin:0 0 10px}.sch{display:grid;gap:14px}.sch .btn{text-align:left;font-size:17px}
.board{position:relative;aspect-ratio:1;background:#b9a6f5;width:calc(100% - 10px)}
.mt{position:absolute;width:25%;height:25%;display:grid;place-items:center;font:700 clamp(16px,6vw,34px) "Pixelify Sans";color:#4a3b6b;box-shadow:inset 0 0 0 5px #b9a6f5,inset 0 0 0 9px var(--ink),inset 12px 12px 0 9px rgba(255,255,255,.5);transition:left .14s ease-out,top .14s ease-out}
.mt.new{animation:pp .2s}.mt.pop{animation:mp .2s}@keyframes pp{from{transform:scale(0)}}@keyframes mp{50%{transform:scale(1.25)}}
.modal,.unl{position:fixed;inset:0;z-index:120;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px;text-align:center}
.modal{background:rgba(20,15,38,.75)}.modal .px{background:var(--panel);padding:20px;max-width:520px;max-height:85dvh;overflow:auto;text-align:left;margin:5px;box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),8px 12px 0 0 var(--shadow)}
.unl{background:#140f26;color:#fff}.unl.fl{animation:fl .9s steps(6)}@keyframes fl{0%,40%{background:#fff}}
.cf{position:fixed;top:-40px;font-size:28px;z-index:121;animation:fall 2.6s linear forwards}@keyframes fall{to{transform:translateY(112vh) rotate(360deg)}}
.set{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}

:root{--st:polygon(0 8px,4px 8px,4px 4px,8px 4px,8px 0,calc(100% - 8px) 0,calc(100% - 8px) 4px,calc(100% - 4px) 4px,calc(100% - 4px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 4px) calc(100% - 8px),calc(100% - 4px) calc(100% - 4px),calc(100% - 8px) calc(100% - 4px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 4px),4px calc(100% - 4px),4px calc(100% - 8px),0 calc(100% - 8px))}
.hero{position:relative;isolation:isolate;background:var(--ink);clip-path:var(--st);box-shadow:none!important;margin:6px 6px 14px;padding:30px 28px 46px;gap:28px;color:#4a3b6b}
.hero::before{content:"";position:absolute;inset:4px;z-index:-1;clip-path:var(--st);background:linear-gradient(#7bd88f,#7bd88f) bottom/100% 18px no-repeat,linear-gradient(#5cc277,#5cc277) bottom/100% 6px no-repeat,linear-gradient(#bfe6ff 0 30%,#d4ecff 30% 52%,#ffe3f0 52% 74%,#ffd1e6 74%)}
.hero::after{content:"";position:absolute;top:22px;right:9%;width:8px;height:8px;z-index:-1;background:#fff;box-shadow:8px 0 #fff,16px 0 #fff,24px 0 #fff,-8px 8px #fff,0 8px #fff,8px 8px #fff,16px 8px #fff,24px 8px #fff,32px 8px #fff}
.hero h1{text-shadow:3px 3px 0 #fff}.hero p{font-weight:700}
.gc,.btn,.nb,.card{transition:transform .1s}
@media(hover:hover){.gc:hover,.btn:hover,.nb:hover{transform:translateY(-3px)}.card:not(.done):hover{transform:translateY(-2px)}}
.jig canvas{display:block}
.play>div.jigw{width:min(100%,max(300px,calc((100dvh - 330px)/1.2)),760px)}
.modal h2{margin:0 0 10px}.modal p,.modal li{margin:0 0 10px;line-height:1.5;font-size:17px}.modal ul{padding-left:20px;margin:0 0 10px}
@media(max-width:560px){.nav{gap:6px;padding:8px}.nav b{font-size:10px}.nb{padding:3px 8px;font-size:14px}.hero{padding:22px 14px 40px}.cards{grid-template-columns:1fr}.sch .btn{font-size:15px}}
</style>
</head>
<body>
<header class="nav"><b><canvas id="nbc"></canvas>MIMO ARCADE</b><a class="nb" href="#">Home</a><button class="nb" id="bs">Settings</button><button class="nb" id="bt">Terms</button><button class="nb" id="bp">Privacy</button><span class="nb" id="tot"></span></header>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s),pick=a=>a[Math.random()*a.length|0];
function mk(t,p,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;if(p)p.append(e);return e}
const bestOf=id=>{try{return localStorage.getItem('ma-'+id)}catch(e){return null}};
function save(g,n){const b=bestOf(g.id);if(b==null||(g.low?n<+b:n>+b))try{localStorage.setItem('ma-'+g.id,n)}catch(e){}}
const P={o:'#4a3b6b',k:'#4a3b6b',m:'#4a3b6b',w:'#fffafc',p:'#ff9ec4',s:'#ffffff',h:'#ff6fa5',y:'#ffd84d',d:'#9fb0dd'};
function spr(c,r,x,y,s){r.forEach((row,j)=>{for(let i=0;i<row.length;i++){const h=row[i];if(h!=='.'){c.fillStyle=P[h];c.fillRect(x+i*s,y+j*s,s,s)}}})}
const MR=["..ooo......ooo..",".opppo....opppo.",".opppo....opppo.","...oooooooooo...","..owwwwwwwwwwo..",".owwwwwwwwwwwwo.",".owwskwwwwskwwo.",".owwkkwwwwkkwwo.",".owwkkwwwwkkwwo.",".oppwwwwwwwwppo.",".owwwwmwwmwwwwo.",".owwwwwmmwwwwwo.","..owwwwwwwwwwo..","...oooooooooo..."];
const S={star:["...yy...","...yy...","yyyyyyyy",".yyyyyy.","..yyyy..",".yyyyyy.",".yy..yy.","y......y"],
heart:[".hh..hh.","hwhhhhhh","hhhhhhhh","hhhhhhhh",".hhhhhh.","..hhhh..","...hh...","........"],
cloud:["........","..dd.dd.",".dddddd.","ddkddkdd","dddddddd",".dddddd.","..d..d..","........"]};
function mochiRows(m){const r=[...MR];
 if(m=='blink')r[6]=r[8]=r[5];
 if(m=='wow')r[10]=r[11];
 if(m=='sad'){r[10]=r[11];r[11]=".owwwwmwwmwwwwo."}
 return r}
let _u;function mochiURL(){if(!_u){const cv=document.createElement('canvas');cv.width=16;cv.height=14;spr(cv.getContext('2d'),MR,0,0,1);_u=cv.toDataURL()}return _u}
document.documentElement.style.setProperty('--mochi','url('+mochiURL()+')');

const GREET=['Hi hi! I’m Mimo!','Wanna play? Pick any game!','I’ve been waiting for you!','Yay, you’re here!'];
const TAP=['Hehe, that tickles!','Boop!','Aww, thank you!','You’re the best!','Again, again!'];
const WIN=['New best! I’m so proud of you!','Wow, you did it!','Yay yay yay!','You’re amazing!'];
const END=['Aww, so close! One more try?','Good game! That was fun!','I believe in you. Again?','You were great. Let’s go again!'];

let stop=[],page=[],KEY=null,SW=null;
function mascot(parent,cls){
 const w=mk('div',parent,'mas '+cls),b=mk('div',w,'bub'),cv=mk('canvas',w,'mochi');let tm;
 const draw=m=>{cv.width=16;cv.height=14;spr(cv.getContext('2d'),mochiRows(m),0,0,1)};
 const say=(t,m)=>{b.textContent=t;if(m=='sad')sfx('bad');if(m){draw(m);setTimeout(()=>draw(),1500)}};
 const cheer=n=>{sfx('cheer');for(let i=0;i<(n||4);i++){const h=mk('span',w,'ht','💖');h.style.left=15+Math.random()*65+'%';h.style.animationDelay=i*90+'ms';setTimeout(()=>h.remove(),1400)}};
 const blink=()=>{draw('blink');setTimeout(()=>draw(),140);tm=setTimeout(blink,2500+Math.random()*2500)};
 draw();tm=setTimeout(blink,1800);page.push(()=>clearTimeout(tm));
 cv.onclick=()=>{sfx(pick(['giggle','uwu','boop']));say(pick(TAP),'wow');cheer(3)};
 return{say,cheer}}

/* ---------- games ---------- */
function hearts(el,api){
 const cv=mk('canvas',el,'cv');cv.width=160;cv.height=120;const c=cv.getContext('2d');
 let z=0,px=72,tx=72,it=[],t=0,sc=0,n=0,lv=3,st=0,raf,last=0;
 const cl=[[8,12],[64,6],[118,20],[34,44],[96,56]];
 const hud=()=>api.hud('Score '+sc+'   '+'♥'.repeat(lv)+'♡'.repeat(3-lv));
 const aim=e=>{const r=cv.getBoundingClientRect();tx=Math.min(144,Math.max(0,(e.clientX-r.left)/r.width*160-8))};
 cv.onpointermove=aim;cv.onpointerdown=aim;
 api.key(e=>{if(e.key=='ArrowLeft'||e.key=='ArrowRight'){e.preventDefault();tx=Math.min(144,Math.max(0,tx+(e.key=='ArrowLeft'?-16:16)))}});
 const loop=ts=>{const d=Math.min(2,(ts-(last||ts))/16.67);last=ts;
  if(!st){t+=d;if(t>=Math.max(22,50-sc*.8)){t=0;const r=Math.random(),bad=Math.min(.42,.22+sc*.004);it.push({x:Math.random()*144,y:-16,v:.7+Math.random()*.4+sc*.015,k:r<bad?'cloud':r<bad+.1?'star':'heart'})}
   px+=(tx-px)*Math.min(1,.28*d);
   it=it.filter(o=>{o.y+=o.v*d;if(o.y+16>102&&o.y<116&&Math.abs(o.x-px)<14){if(o.k=='cloud'){lv--;sfx('bad')}else{sfx('pop');sc+=o.k=='star'?3:1;if(++n%6==0)api.cheer(2)}hud();return 0}return o.y<120});
   if(lv<=0){st=1;api.end(sc)}}
  c.fillStyle='#cfe8ff';c.fillRect(0,0,160,120);c.fillStyle='#fff';cl.forEach(p=>{c.fillRect(p[0],p[1],22,5);c.fillRect(p[0]+4,p[1]-3,12,4)});
  c.fillStyle='#a6e8b8';c.fillRect(0,116,160,4);
  it.forEach(o=>spr(c,S[o.k],o.x|0,o.y|0,2));spr(c,mochiRows(st?'sad':''),px|0,102,1);
  if(st){c.fillStyle='rgba(74,59,107,.85)';c.fillRect(0,44,160,32);c.fillStyle='#fff';c.textAlign='center';c.font='12px "Pixelify Sans",monospace';c.fillText('Oh no, soggy Mimo!',80,64)}
  if(!st||z++<2)raf=requestAnimationFrame(loop)};
 api.onstop(()=>cancelAnimationFrame(raf));hud();raf=requestAnimationFrame(loop)}

function flight(el,api){
 const cv=mk('canvas',el,'cv');cv.width=160;cv.height=120;const c=cv.getContext('2d');
 let z=0,y=52,v=0,ps=[],t=70,sc=0,st=0,raf,last=0;
 const flap=()=>{if(st==2)return;st=1;v=-2.5};
 cv.onpointerdown=flap;api.key(e=>{if(e.key==' '||e.key=='ArrowUp'){e.preventDefault();flap()}});
 const loop=ts=>{const d=Math.min(2,(ts-(last||ts))/16.67);last=ts;
  if(st==0)y=52+Math.sin(ts/220)*4;
  if(st==1){v+=.15*d;y+=v*d;t+=d;if(t>=88){t=0;ps.push({x:160,g:14+Math.random()*52,p:0})}
   ps.forEach(p=>{p.x-=1.15*d;if(!p.p&&p.x+18<32){p.p=1;sc++;api.hud('Score '+sc);if(sc%5==0)api.cheer(2)}});ps=ps.filter(p=>p.x>-20);
   if(y<0||y>102||ps.some(p=>44>p.x&&32<p.x+18&&(y+2<p.g||y+12>p.g+42))){st=2;api.end(sc)}}
  c.fillStyle='#cfe8ff';c.fillRect(0,0,160,120);
  ps.forEach(p=>{c.fillStyle='#ffc2da';c.fillRect(p.x,0,18,p.g);c.fillRect(p.x,p.g+42,18,80);c.fillStyle='#fff';c.fillRect(p.x+3,0,3,p.g);c.fillRect(p.x+3,p.g+42,3,80);c.fillStyle='#ff9ec4';c.fillRect(p.x-2,p.g-5,22,5);c.fillRect(p.x-2,p.g+42,22,5)});
  c.fillStyle='#a6e8b8';c.fillRect(0,116,160,4);
  spr(c,mochiRows(st==2?'sad':''),32,y|0,1);
  c.textAlign='center';c.font='11px "Pixelify Sans",monospace';
  if(st==0){c.fillStyle='#4a3b6b';c.fillText('Tap to float up!',80,34)}
  if(st==2){c.fillStyle='rgba(74,59,107,.85)';c.fillRect(0,44,160,30);c.fillStyle='#fff';c.fillText('Bonk! Mimo is okay.',80,63)}
  if(st<2||z++<3)raf=requestAnimationFrame(loop)};
 api.onstop(()=>cancelAnimationFrame(raf));api.hud('Tap, click or press space');raf=requestAnimationFrame(loop)}

function memory(el,api){
 const sy=['🍓','🐱','🌸','⭐','🍩','🐰','🌈','🧁'],a=[...sy,...sy].sort(()=>Math.random()-.5);let open=[],lock=0,mv=0,done=0;
 const gr=mk('div',el,'grid g4');
 a.forEach(s=>{const b=mk('button',gr,'card','♡');b.onclick=()=>{if(lock||b.classList.contains('up')||b.classList.contains('done'))return;b.classList.add('up');b.textContent=s;open.push(b);
